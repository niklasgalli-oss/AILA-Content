<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden – Sapaude</title>
  <meta name="description" content="Veni, vidi, KI. Diese Seite gibt es nicht.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F6F1E8;
      color: #1C1916;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    main { width: min(36rem, calc(100% - 2.4rem)); padding: 2.5rem 0 3rem; }
    .brand {
      display: inline-flex;
      align-items: baseline;
      color: inherit;
      text-decoration: none;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
    }
    .dot {
      display: inline-block;
      width: 0.2em;
      height: 0.2em;
      margin-left: 0.09em;
      background: #3C9EC4;
    }
    h1 { font-weight: 500; font-size: clamp(2.2rem, 6vw, 3.4rem); letter-spacing: -0.03em; line-height: 1.02; margin: 1.4rem 0 0.6rem; }
    p { font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif; font-size: 1.05rem; line-height: 1.5; }
    .en { color: #6B635A; }
    a { color: inherit; }
    nav { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; margin-top: 1.4rem; }
    nav a { min-height: 44px; display: inline-flex; align-items: center; }
    .claims { margin-top: 2.2rem; color: #6B635A; font-style: italic; }
    .claims p { margin: 0.2rem 0; font-family: inherit; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="sapaude.">sapaude<span class="dot" aria-hidden="true"></span></a>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Der Pfad führt nicht weiter. Die Startseite ist noch da.</p>
    <p class="en" lang="en">This page is not here. The home page still is.</p>
    <nav>
      <a href="/">Zur Startseite</a>
      <a href="/en/" hreflang="en" lang="en">English home</a>
      <a href="/support/">Support</a>
    </nav>
    <div class="claims">
      <p lang="de">Veni, vidi, KI.</p>
      <p lang="en">Be brave. Get smart.</p>
    </div>
  </main>
</body>
</html>

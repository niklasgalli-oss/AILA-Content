name: Validate pulse

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_urls:
        description: Request each source URL and require HTTP 200
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run validator tests
        run: node --test scripts/validate.test.mjs

      - name: Validate pulse.json
        # Off on push and pull_request. Publishers often block automated clients.
        run: node scripts/validate.mjs${{ inputs.check_urls == true && ' --check-urls' || '' }}
